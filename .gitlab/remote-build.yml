# CI file for the gitlab.com mirror only (set as its ci_config_path).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"

# PACKAGE_LANE=1 runs the package lane instead of the dev build;
# RELEASE_CHECKS=1 adds the pre-release source checks.
include:
  - local: .gitlab/packages.yml
  - local: .gitlab/release-checks.yml

build-nixos:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h 50m
  rules:
    - if: $PACKAGE_LANE == "1"
      when: never
    - when: on_success
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  cache:
    key: remote-build
    paths: [.ci-cargo/]
    unprotect: true
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cmake -S . -B build-remote -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_RUST_SDK_BACKEND=ON -DBUILD_TESTING=OFF
    - nix develop -c cmake --build build-remote --target lightning-matrix -j32
    - strip build-remote/lightning-matrix || nix develop -c strip build-remote/lightning-matrix
    - mkdir -p out && cp build-remote/lightning-matrix out/
    - nix flake metadata --json | sha256sum > out/flake.sha256
  artifacts:
    paths: [out/]
    expire_in: 1 week

.qt-test-env:
  script:
    - export QT_QPA_PLATFORM=offscreen HOME=$PWD/.ci-home XDG_RUNTIME_DIR=$PWD/.ci-run; mkdir -p $HOME $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
    - mkdir -p $PWD/.ci-fonts
    - |
      cat > $PWD/.ci-fonts/fonts.conf <<CONF
      <?xml version="1.0"?>
      <fontconfig>
      <dir>$PWD/data/fonts</dir>
      <cachedir>$PWD/.ci-fonts/cache</cachedir>
      <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
      <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
      </fontconfig>
      CONF
    - export FONTCONFIG_FILE=$PWD/.ci-fonts/fonts.conf
    - mkdir -p /etc/dbus-1 /var/lib/dbus
    - |
      cat > /etc/dbus-1/session.conf <<'CONF'
      <busconfig><type>session</type><listen>unix:tmpdir=/tmp</listen>
      <policy context="default"><allow send_destination="*" eavesdrop="true"/><allow eavesdrop="true"/><allow own="*"/></policy>
      </busconfig>
      CONF
    - nix develop -c dbus-uuidgen --ensure=/etc/machine-id

# Needs CTEST_LOG, CTEST_RC and ${CTEST_LOG%.log}-registered.txt (ctest -N).
# The retry stays, but a first-attempt failure is kept in
# ${CTEST_LOG%.log}-first-attempt-failures.tsv, and every registered test must
# have run.
.ctest-gate:
  script:
    - |
      # First attempts carry an "i/N" counter; --repeat until-pass retries do not.
      re='^ *([0-9]+/[0-9]+ )?Test +#[0-9]+: ([^ ]+) [ .]*(\*\*\*)?(.*[^ ]) +[0-9.]+ sec$'
      declare -A first final; order=()
      while IFS= read -r line; do
        if [[ $line =~ $re ]]; then
          name=${BASH_REMATCH[2]}
          if [[ -n ${BASH_REMATCH[1]} ]]; then first[$name]=${BASH_REMATCH[4]}; order+=("$name"); fi
          final[$name]=${BASH_REMATCH[4]}
        fi
      done <"$CTEST_LOG"
      tsv=${CTEST_LOG%.log}-first-attempt-failures.tsv
      printf 'test\tfirst_attempt\tfinal\n' >"$tsv"
      for name in "${order[@]}"; do
        if [[ ${first[$name]} != Passed ]]; then printf '%s\t%s\t%s\n' "$name" "${first[$name]}" "${final[$name]}" >>"$tsv"; fi
      done
      echo "first-attempt failures ($tsv):"; cat "$tsv"
      registered=$(grep -oE '^Total Tests: [0-9]+' "${CTEST_LOG%.log}-registered.txt" | grep -oE '[0-9]+$' || true)
      echo "registered ${registered:-unknown}, run ${#order[@]}, ctest exit $CTEST_RC"
      if [[ -z $registered || $registered -eq 0 || ${#order[@]} -ne $registered ]]; then echo "not every registered test ran"; exit 1; fi
      if [[ $CTEST_RC != 0 ]]; then echo "ctest failed"; exit 1; fi
      grep -q '100% tests passed' "$CTEST_LOG"

test-nixos:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h 50m
  rules:
    - if: $RUN_TESTS == "1"
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    CCACHE_DIR: $CI_PROJECT_DIR/.ci-ccache
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_NOHASHDIR: "true"
    CCACHE_MAXSIZE: 4G
    SCCACHE_DIR: $CI_PROJECT_DIR/.ci-sccache
    SCCACHE_CACHE_SIZE: 4G
    CARGO_INCREMENTAL: "0"
  cache:
    - key: remote-build
      paths: [.ci-cargo/]
      policy: pull
      unprotect: true
    - key: test-ccache
      paths: [.ci-ccache/, .ci-sccache/]
      when: always
      unprotect: true
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - export RUSTC_WRAPPER=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#sccache)/bin/sccache
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cmake -S . -B build-test -G Ninja -DENABLE_RUST_SDK_BACKEND=ON -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_FLAGS=-g0 "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--strip-debug" -DCMAKE_JOB_POOLS=lk=12 -DCMAKE_JOB_POOL_LINK=lk
    - nix develop -c ccache -z
    - nix develop -c cmake --build build-test -j32
    - nix develop -c ccache -s
    - $RUSTC_WRAPPER --show-stats | grep -E 'Cache hits|Cache misses|Non-cacheable' || true
    - mkdir -p out
    - !reference [.qt-test-env, script]
    - nix develop -c ctest --test-dir build-test -N >out/ctest-registered.txt
    - rc=0; nix develop -c dbus-run-session -- ctest --test-dir build-test -j8 --timeout 1500 --repeat until-pass:2 --output-junit $PWD/out/ctest.xml --output-on-failure >out/ctest.log 2>&1 || rc=$?
    - tail -40 out/ctest.log
    - CTEST_LOG=out/ctest.log CTEST_RC=$rc
    - !reference [.ctest-gate, script]
  artifacts:
    when: always
    paths: [out/]
    expire_in: 1 week

test-rust:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 1h
  rules:
    - if: $RUN_TESTS == "1"
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
  cache:
    key: remote-build
    paths: [.ci-cargo/]
    policy: pull
    unprotect: true
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - mkdir -p out
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - rc=0; nix develop -c cargo test --manifest-path rust/Cargo.toml -j32 >out/cargo.log 2>&1 || rc=$?; echo "$rc" >out/cargo.rc
    - grep -E '^test result|FAILED|panicked|^error' out/cargo.log | head -40 || true
    - echo "cargo test exited $(cat out/cargo.rc)"; test "$(cat out/cargo.rc)" = 0
    - "grep -qE '^test result: ok\\. [1-9][0-9]* passed' out/cargo.log"
  artifacts:
    when: always
    paths: [out/]
    expire_in: 1 week

test-nonrust:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h
  rules:
    - if: $PACKAGE_LANE == "1"
      when: never
    - if: $RUN_NONRUST == "1" || $RELEASE_CHECKS == "1"
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CCACHE_DIR: $CI_PROJECT_DIR/.ci-ccache-nonrust
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_NOHASHDIR: "true"
    CCACHE_MAXSIZE: 4G
  cache:
    - key: test-ccache-nonrust
      paths: [.ci-ccache-nonrust/]
      when: always
      unprotect: true
  script:
    - nix develop -c cmake -S . -B build-nonrust -G Ninja -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_FLAGS=-g0 "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--strip-debug" -DCMAKE_JOB_POOLS=lk=12 -DCMAKE_JOB_POOL_LINK=lk
    - nix develop -c cmake --build build-nonrust -j32
    - mkdir -p out
    - !reference [.qt-test-env, script]
    - nix develop -c ctest --test-dir build-nonrust -N >out/ctest-nonrust-registered.txt
    - rc=0; nix develop -c dbus-run-session -- ctest --test-dir build-nonrust -j8 --timeout 1500 --repeat until-pass:2 --output-junit $PWD/out/ctest-nonrust.xml --output-on-failure >out/ctest-nonrust.log 2>&1 || rc=$?
    - tail -40 out/ctest-nonrust.log
    - CTEST_LOG=out/ctest-nonrust.log CTEST_RC=$rc
    - !reference [.ctest-gate, script]
  artifacts:
    when: always
    paths: [out/]
    expire_in: 1 week
